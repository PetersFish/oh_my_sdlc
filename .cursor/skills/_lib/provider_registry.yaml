version: 2

modules:
  spec:
    default_provider: openspec
    providers:
      openspec:
        capabilities:
          create: true
          continue: false
          apply: true
          archive: true
        dispatch:
          create: {kind: skill, target: openspec-propose}
          apply: {kind: skill, target: openspec-apply-change}
          archive: {kind: skill, target: openspec-archive-change}
        verifier:
          create: {target: openspec.create}
          apply: {target: openspec.apply}
          archive: {target: openspec.archive}
        result_contract:
          create: spec_change
          apply: spec_change
          archive: spec_change

  memory:
    default_provider: local
    providers:
      local:
        capabilities:
          load: false
          repository_sync: true
          spec_post_archive_sync: false
        dispatch:
          repository_sync: {kind: skill, target: sdlc-repository-memory-sync}
        verifier:
          repository_sync: {target: local.repository_sync}
        result_contract:
          repository_sync: memory_sync
