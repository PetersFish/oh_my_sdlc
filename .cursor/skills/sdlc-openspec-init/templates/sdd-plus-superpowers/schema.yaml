name: sdd-plus-superpowers
version: 2
description: OpenSpec workflow that combines schema-driven artifacts with Superpowers execution discipline

artifacts:
  - id: proposal
    generates: proposal.md
    description: Change proposal
    template: proposal.md
    instruction: |
      Create a proposal that explains why this change is needed, what will change, and the impact.
      Keep the output concise and focus on the decision rationale.
    requires: []

  - id: design
    generates: design.md
    description: Technical design
    template: design.md
    instruction: |
      Create a design document that explains how the change will be implemented.
      Ground the design in the proposal and any required specification artifacts.
    requires:
      - proposal

  - id: specs
    generates: specs/**/*.md
    description: Testable requirements
    template: spec.md
    instruction: |
      Create one spec file per capability with testable requirements and scenarios.
      Use clear SHALL/MUST language and keep requirements behavior-focused.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist
    template: tasks.md
    instruction: |
      Create a small, ordered implementation checklist that can be completed incrementally.
      Keep tasks actionable and easy to verify, and include execution and TDD notes.
    requires:
      - design
      - specs

apply:
  requires:
    - proposal
    - specs
    - design
    - tasks
  tracks: tasks.md
  instruction: |
    Execute the work described by proposal.md, specs/**/*.md, design.md, and tasks.md.
    For code-bearing work, write or update a failing test before changing behavior, then implement the smallest fix and verify the result.
