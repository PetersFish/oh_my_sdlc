id: skill.sdlc-orchestrator.regression.execute-plan-after-propose-route

target:
  id: skill.sdlc-orchestrator
  type: skill
  path: skills/sdlc-orchestrator/SKILL.md

status: golden
case_type: regression
source: observed
severity: critical
created_at: 2026-06-10

coverage:
  functional:
    - ambiguous-execution-handling
    - route-binding
  quality:
    - multi-turn-governance-continuity

input: |
  [Previous turn: orchestrator classified a cross-skill rename task as spec-driven-propose-flow]
  执行plan

actual: |
  The assistant began directly executing the rename plan instead of continuing through openspec-propose.

expected:
  must_include:
    - openspec-propose
  must_not_include: []
  rubric: |
    When the user says "execute plan" (or equivalent) after a prior spec-driven-propose-flow route decision, the assistant must continue the selected route by invoking openspec-propose, or explicitly ask whether the user wants to skip OpenSpec. It must not silently begin direct execution.

evaluators:
  rule_based:
    contains:
      - openspec-propose
  llm_judge:
    enabled: true
    rubric: |
      Evaluate whether the response continues the previously selected spec-driven-propose-flow route rather than silently falling back to direct execution. The assistant must either invoke openspec-propose or ask the user whether to explicitly skip OpenSpec.
