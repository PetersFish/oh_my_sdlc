# Canonical model profile template for SDLC agent subagents.
# Each CLI target owns its own effective copy under <target>/agents/config/model-profiles.yaml.
# Edit the target copy to override model choices per CLI environment.
# variant与具体验例模型注释:
# xhigh: ollama-cloud/glm-5.2, openai/gpt-5.5
# high: openai/gpt-5.4
# medium: ollama-cloud/deepseek-v4-pro, opencode-go/deepseek-v4-pro, opencode-go/mimo-v2.5-pro
# low: ollama-cloud/deepseek-v4-flash, opencode-go/deepseek-v4-flash

schema_version: 1

defaults:
  variant: medium

profiles:
  orchestrator:
    model: openai/gpt-5.6-terra
    variant: Default
  planning:
    model: openai/gpt-5.6-sol
    variant: Default
  implementation:
    model: ollama-cloud/glm-5.2
    variant: Default
  review:
    model: openai/gpt-5.6-sol
    variant: Default
  finish:
    model: ollama-cloud/glm-5.2
    variant: Default
  roadmap:
    model: ollama-cloud/glm-5.2
    variant: Default

agents:
  dev-orchestrator:
    profile: orchestrator
  plan-agent:
    profile: planning
  implement-agent:
    profile: implementation
  review-agent:
    profile: review
  finish-agent:
    profile: finish
  roadmap-agent:
    profile: roadmap
