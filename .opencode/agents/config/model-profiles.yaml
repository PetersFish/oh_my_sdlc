# Canonical model profile template for SDLC agent subagents.
# Each CLI target owns its own effective copy under <target>/agents/config/model-profiles.yaml.
# Edit the target copy to override model choices per CLI environment.
schema_version: 1

defaults:
  variant: medium

profiles:
  orchestrator:
    model: ollama-cloud/glm-5.2
    variant: Default
  planning:
    model: ollama-cloud/glm-5.2
    variant: Default
  implementation:
    model: opencode-go/deepseek-v4-pro
    variant: Default
  testing:
    model: opencode-go/mimo-v2.5-pro
    variant: Default
  review:
    model: ollama-cloud/glm-5.2
    variant: Default
  finish:
    model: opencode-go/mimo-v2.5-pro
    variant: Default

agents:
  dev-orchestrator:
    profile: orchestrator
  plan-agent:
    profile: planning
  implement-agent:
    profile: implementation
  test-agent:
    profile: testing
  review-agent:
    profile: review
  finish-agent:
    profile: finish
