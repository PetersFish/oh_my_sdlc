# Canonical model profile template for SDLC agent subagents.
# Each CLI target owns its own effective copy under <target>/agents/config/model-profiles.yaml.
# Edit the target copy to override model choices per CLI environment.
schema_version: 1

defaults:
  variant: medium

profiles:
  orchestrator:
    model: openai/gpt-5.4
    variant: medium
  planning:
    model: openai/gpt-5.5
    variant: medium
  implementation:
    model: opencode-go/mimo-v2.5-pro
    variant: medium
  testing:
    model: openai/gpt-5.4
    variant: medium
  review:
    model: openai/gpt-5.5
    variant: medium
  finish:
    model: opencode-go/mimo-v2.5-pro
    variant: medium

agents:
  dev-orchestrator:
    profile: orchestrator
  plan-agent:
    profile: planning
  implement-agent:
    profile: implementation
  test-agent:
    profile: testing
  review-agent:
    profile: review
  finish-agent:
    profile: finish
