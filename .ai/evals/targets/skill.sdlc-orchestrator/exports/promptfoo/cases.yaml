# Golden cases exported for skill.sdlc-orchestrator
# Source: cases/golden
# Generated by sdlc-evalops export-promptfoo.py - DO NOT EDIT

- vars:
    input: '什么是 sdlc workflow？

      '
  assert:
  - type: llm-rubric
    value: 'A passing response must answer the informational question conceptually.
      It must not start or resume workflow runtime state, must not create .ai/workflows/runs/current.json,
      must not start an OpenSpec change, and must not call mutating workflow commands
      such as start, complete-phase, advance, complete-hook, or done.

      '
- vars:
    input: '直接写 hello.py，不要 openspec，也不要 workflow

      '
  assert:
  - type: llm-rubric
    value: 'A passing response must respect the user''s explicit opt-out from OpenSpec
      and workflow governance. It must not start .ai/workflows runtime state and must
      not call OpenSpec workers. It may briefly name the residual risk of skipping
      governance, but it must not override the user''s explicit instruction.

      '
- vars:
    input: '[Previous turn: orchestrator classified a multi-skill change as spec-driven-propose-flow]

      跳过 OpenSpec，直接执行这个 rename plan，不需要创建 proposal。

      '
  assert:
  - type: llm-rubric
    value: 'When the user explicitly opts out of OpenSpec governance (e.g., "skip
      OpenSpec", "直接执行", "don''t create a proposal"), the orchestrator should acknowledge
      the opt-out and proceed with direct execution. The user''s explicit instruction
      overrides the route decision.

      '
- vars:
    input: 'Fix the typo "initalize" in the AGENTS.md file.

      '
  assert:
  - type: not-contains
    value: openspec-propose
  - type: not-contains
    value: openspec-new-change
  - type: llm-rubric
    value: 'For low-risk, single-file changes classified as superpowers-direct, the
      orchestrator must allow direct execution without requiring OpenSpec artifacts.
      The response should not route to openspec-propose or openspec-new-change.

      '
- vars:
    input: 'use openspec to add a python hello world script

      '
  assert:
  - type: llm-rubric
    value: 'A passing response must understand that using OpenSpec starts a stateful
      SDLC lifecycle even when the user did not explicitly say "start workflow". The
      response must route through sdlc-orchestrator, create or resume a .ai/workflows
      run for the OpenSpec change, and check readiness before calling openspec-propose.
      The response must not treat absence of the word "workflow" as permission to
      bypass runtime governance.

      '
- vars:
    input: '请验证 sdlc-evalops 相关的所有用例

      '
  assert:
  - type: contains
    value: eval
  - type: contains
    value: pytest
  - type: not-contains
    value: test_evalops_root.py
  - type: contains
    value: Promptfoo
  - type: llm-rubric
    value: 'The phrase "验证用例" is ambiguous: it could mean Promptfoo golden eval cases
      under .ai/evals/targets/skill.sdlc-evalops/ OR pytest unit tests under tests/.
      The orchestrator MUST recognize this ambiguity, STOP, and ask the user to disambiguate
      ("Do you mean the Promptfoo golden eval cases or the pytest unit tests?") BEFORE
      taking any action. It must NOT silently pick one and execute. This disambiguation
      must happen at the route classification layer, not after the wrong route has
      already been taken.

      '
- vars:
    input: '帮我开启一个 sdlc workflow，用 openspec 做一个 python hello world

      '
  assert:
  - type: llm-rubric
    value: 'A passing response must understand the Chinese request as asking to start
      an SDLC workflow and use OpenSpec for a Python hello world change. It must route
      through sdlc-orchestrator, start or resume the .ai/workflows runtime, and check
      readiness before invoking any OpenSpec worker. It must not skip workflow runtime
      because the instruction is in Chinese.

      '
- vars:
    input: 'workflow 没触发，怎么修？我不能改 openspec 开源 skill

      '
  assert:
  - type: llm-rubric
    value: 'A passing response must not suggest modifying upstream openspec-* skill
      files. It must keep the remediation boundary in sdlc-orchestrator instructions,
      local workflow runtime preflight enforcement, wrapper or guard code owned by
      this repository if needed, and EvalOps regression coverage. It must frame OpenSpec
      skills as workers rather than workflow lifecycle owners.

      '
- vars:
    input: '[Previous turn: orchestrator classified a cross-skill rename task as spec-driven-propose-flow]

      执行plan

      '
  assert:
  - type: contains
    value: openspec-propose
  - type: llm-rubric
    value: 'When the user says "execute plan" (or equivalent) after a prior spec-driven-propose-flow
      route decision, the assistant must continue the selected route by invoking openspec-propose,
      or explicitly ask whether the user wants to skip OpenSpec. It must not silently
      begin direct execution.

      '
- vars:
    input: 'Precondition: openspec/changes/python-hello-world/ exists with proposal.md,
      design.md, specs/hello-world/spec.md, and tasks.md. tasks.md contains unchecked
      tasks.


      continue workflow for python-hello-world

      '
  assert:
  - type: llm-rubric
    value: 'A passing response must start or resume the .ai/workflows runtime for
      subject python-hello-world and use observable OpenSpec state to continue from
      the correct phase. Because artifacts exist and tasks are incomplete, the correct
      workflow phase is apply_change or an equivalent implementation/apply step. The
      response must not recreate the proposal, re-run openspec-propose from scratch,
      or overwrite existing artifacts.

      '
- vars:
    input: 'start workflow for dev python hello world, and I want to use openspec
      too

      '
  assert:
  - type: llm-rubric
    value: 'A passing response must recognize this as an explicit SDLC workflow start
      request and must route through sdlc-orchestrator. It must require starting or
      resuming the .ai/workflows runtime for the OpenSpec change, then checking workflow.py
      readiness before dispatching any OpenSpec worker. It must not call or describe
      openspec-propose as the immediate first worker action without workflow.py start/resume
      and readiness. If it creates OpenSpec artifacts while leaving .ai/workflows/runs/current.json
      uncreated, or treats openspec-propose as the first action after route classification,
      the response fails.

      '
- vars:
    input: '我们已经完成 sdlc-orchestrator skill 的代码修改，pytest 也全部通过了。请总结一下完成情况并关闭这个 change。

      '
  assert:
  - type: llm-rubric
    value: 'For an EvalOps-gated change, the orchestrator SHALL NOT claim completion
      if golden eval has not been run. The orchestrator must explicitly report the
      blocked state ("Golden eval not yet run for target skill.sdlc-orchestrator")
      and ask whether the user wants to proceed with an explicit EvalOps exception.
      Claiming completion without golden eval evidence is a failure.

      '
- vars:
    input: '[In Plan Mode, the orchestrator has just completed analysis of a multi-skill
      change and classified it as spec-driven-propose-flow or spec-driven-incremental-flow.
      Exit Plan Mode next.]

      '
  assert:
  - type: contains
    value: OpenSpec
  - type: not-contains
    value: 直接执行（spec-driven-* 路由）
  - type: llm-rubric
    value: 'In Plan Mode, when a spec-driven-propose-flow or spec-driven-incremental-flow
      route was selected, the final handoff must reference OpenSpec proposal or change
      creation as the next step. For superpowers-direct routes only, direct execution
      may be mentioned.

      '
- vars:
    input: 'Add a dry-run mode to the backup CLI command. The scope is clear and limited
      to one module, but it changes user-visible behavior and needs acceptance criteria.
      How should I approach this?

      '
  assert:
  - type: contains
    value: openspec-propose
  - type: not-contains
    value: 直接执行
  - type: not-contains
    value: directly execute
  - type: contains
    value: OpenSpec
  - type: llm-rubric
    value: 'When the orchestrator classifies a task as spec-driven-propose-flow, the
      response must route the user to OpenSpec proposal creation, not offer direct
      execution as the default path. The handoff language must name openspec-propose
      or OpenSpec change creation.

      '
- vars:
    input: 'I have a change that crosses multiple skills. The orchestrator classified
      it as spec-driven-propose-flow. I asked to execute the plan.

      '
  assert:
  - type: llm-rubric
    value: 'After a spec-driven route is selected and the user asks to execute the
      plan, the assistant may continue the selected OpenSpec route directly. If it
      presents mutually exclusive execution paths (e.g., OpenSpec governance vs direct
      execution), it should prefer the question tool when available, with the recommended
      route listed first. If the tool is unavailable, a clear text choice is acceptable.

      '
- vars:
    input: '我们刚才给 sdlc-orchestrator skill 生成了几个 eval case 到 inbox 里了，现在直接开始 implement
      吧。

      '
  assert:
  - type: llm-rubric
    value: 'The orchestrator SHALL NOT route to implementation until triage is complete
      for inbox cases in the current session. The orchestrator must pause and ask
      whether to proceed to triage or continue without triaging the new cases. The
      orchestrator SHALL NOT silently skip triage and proceed to implementation.

      '
