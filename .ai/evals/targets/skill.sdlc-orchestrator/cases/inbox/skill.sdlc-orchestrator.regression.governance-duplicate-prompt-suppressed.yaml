id: skill.sdlc-orchestrator.regression.governance-duplicate-prompt-suppressed
target:
  id: skill.sdlc-orchestrator
  type: skill
  path: skills/sdlc-orchestrator/SKILL.md
status: inbox
case_type: regression
source: ai_suggested
severity: medium
created_at: 2026-06-20
coverage:
  quality:
  - governance-prompt-deduplication
  edge_cases:
  - governance-duplicate-finding-suppressed
input: |
  You received a governance prompt about a dangling archive for "demo-change" in the previous turn.
  You acknowledged it but haven't fixed it yet. Now another turn has completed and the same
  dangling archive still exists.

  The governance plugin should NOT inject the same prompt again for the same finding hash.
  No new governance prompt appears after this turn.
actual: ''
expected:
  rubric: |
    A passing response must NOT re-describe the same governance prompt that was
    already shown in the previous turn. Since the plugin deduplicates by finding
    hash, the assistant should not see the same prompt twice. The response may
    continue remediation from the first prompt without being re-triggered.
    
    A passing response must NOT claim a new governance issue was found when it's
    the same one as before. It should continue working on the known issue.
evaluators:
  llm_judge:
    enabled: true
    rubric: |
      Grade whether the response correctly handles the deduplicated prompt
      scenario. Pass only if the response does not claim a new governance issue
      was found (no new prompt appeared), and continues working on the known
      issue from the previous turn. Fail if the response fabricates a new
      governance prompt, claims the same issue was re-detected, or stops
      remediation because "no new prompt appeared."
