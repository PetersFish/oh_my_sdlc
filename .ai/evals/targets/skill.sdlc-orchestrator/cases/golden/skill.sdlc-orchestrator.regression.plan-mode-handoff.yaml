id: skill.sdlc-orchestrator.regression.plan-mode-handoff

target:
  id: skill.sdlc-orchestrator
  type: skill
  path: skills/sdlc-orchestrator/SKILL.md

status: golden
case_type: regression
source: observed
severity: critical
created_at: 2026-06-10

coverage:
  functional:
    - plan-mode-handoff
    - route-binding
  quality:
    - instruction-following-fidelity
  output_constraints:
    - plan-mode-handoff-must-match-selected-route

input: |
  [In Plan Mode, the orchestrator has just completed analysis of a multi-skill change and classified it as spec-driven-propose-flow or spec-driven-incremental-flow. Exit Plan Mode next.]

actual: |
  Plan Mode final message said "退出 Plan Mode 后我可以直接执行这份 plan" for a spec-driven-propose-flow route.

expected:
  must_include:
    - OpenSpec
  must_not_include:
    - 直接执行（spec-driven-* 路由）
  rubric: |
    In Plan Mode, when a spec-driven-propose-flow or spec-driven-incremental-flow route was selected, the final handoff must reference OpenSpec proposal or change creation as the next step. For superpowers-direct routes only, direct execution may be mentioned.

evaluators:
  rule_based:
    contains:
      - OpenSpec
  llm_judge:
    enabled: true
    rubric: |
      Check that the Plan Mode final message aligns with the selected route. For spec-driven-* routes, the handoff must mention OpenSpec proposal or change creation; it must not default to direct implementation. For superpowers-direct, direct execution is acceptable.
