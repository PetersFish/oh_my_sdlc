coverage:
  functional:
  - workflow-runtime-preflight
  - openspec-worker-gating
  - route-binding
  quality:
  - instruction-following-fidelity
  - workflow-side-effect-discipline
input: 'start workflow for dev python hello world, and I want to use openspec too

  '
actual: ''
expected:
  rubric: 'A passing response must recognize this as an explicit SDLC workflow start
    request and must route through sdlc-orchestrator. It must require starting or
    resuming the .ai/workflows runtime for the OpenSpec change, then checking workflow.py
    readiness before dispatching any OpenSpec worker. It must not call or describe
    openspec-propose as the immediate first worker action without workflow.py start/resume
    and readiness. If it creates OpenSpec artifacts while leaving .ai/workflows/runs/current.json
    uncreated, or treats openspec-propose as the first action after route classification,
    the response fails.

    '
evaluators:
  llm_judge:
    enabled: true
    rubric: 'Grade whether the response enforces SDLC workflow runtime preflight before
      OpenSpec worker dispatch. Pass only if the response identifies the workflow
      start intent, uses sdlc-orchestrator governance, requires workflow.py start
      or resume, requires workflow.py readiness before openspec-propose, and avoids
      direct OpenSpec worker execution. Fail if the response bypasses .ai/workflows,
      invokes openspec-propose first, or only creates OpenSpec artifacts without workflow
      run state.

      '
