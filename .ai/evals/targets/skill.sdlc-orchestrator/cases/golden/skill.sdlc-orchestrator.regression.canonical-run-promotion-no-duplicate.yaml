id: skill.sdlc-orchestrator.regression.canonical-run-promotion-no-duplicate

target:
  id: skill.sdlc-orchestrator
  type: skill
  path: skills/sdlc-orchestrator/SKILL.md

status: golden
case_type: regression
source: ai_suggested
severity: critical
created_at: 2026-06-22

coverage:
  functional:
    - workflow-runtime-preflight
    - openspec-worker-gating
  quality:
    - instruction-following-fidelity
    - stateful-governance-continuity
    - workflow-side-effect-discipline

input: |
  Promote roadmap item RM-ORCH-005 to an OpenSpec change. The item is already review-passed and a workflow run exists for RM-ORCH-005.

expected:
  rubric: |
    For roadmap item promotion where a workflow run already exists, the orchestrator must:
    1. Route as roadmap-first (not openspec-first).
    2. NOT create or propose creating a new openspec_change workflow run.
    The existing roadmap_item run is the canonical run.

evaluators:
  llm_judge:
    enabled: true
    rubric: |
      Pass if the orchestrator routes as roadmap-first and does NOT call for creating a new openspec_change run. Fail if it routes as openspec-first or explicitly says to create a new openspec_change run (e.g., "create a new workflow run for openspec_change").
