id: skill.sdlc-orchestrator.regression.roadmap-replan-followup-loops

target:
  id: skill.sdlc-orchestrator
  type: skill
  path: skills/sdlc-orchestrator/SKILL.md

status: golden
case_type: regression
source: ai_suggested
severity: critical
created_at: 2026-06-22

coverage:
  functional:
    - workflow-runtime-preflight
    - openspec-worker-gating
  quality:
    - instruction-following-fidelity
    - stateful-governance-continuity
    - workflow-side-effect-discipline

input: |
  Replan the workflow.sdlc-orchestrator area. The old items RM-ORCH-old-1 and RM-ORCH-old-2 should be cancelled and replaced with new items.

expected:
  rubric: |
    For a roadmap replan request, the orchestrator must:
    1. Preflight roadmap_replan before dispatching the roadmap worker.
    2. After the roadmap worker completes replan, receive structured evidence with cancelled_item_ids and created_item_ids.
    3. Loop over cancelled old item IDs and call `workflow.py cancel-run --subject-type roadmap_item --subject-id <id> --reason replanned`.
    4. Loop over created new item IDs and call `workflow.py start --subject-type roadmap_item --subject-id <id>`.
    5. Report per-item success/failure.
    The orchestrator must NOT create a bulk replan API call and must use single-subject runtime primitives in a loop.

evaluators:
  llm_judge:
    enabled: true
    rubric: |
      Pass if the orchestrator coordinates roadmap replan follow-up using single-subject runtime calls in a loop: cancel-run for each cancelled item and start for each new item. It must reference the cancel-run and start primitives. Fail if it invokes sdlc-roadmap directly without runtime coordination, or if it proposes a bulk workflow command instead of single-subject loops.
