id: skill.sdlc-orchestrator.regression.roadmap-replan-followup-loops

target:
  id: skill.sdlc-orchestrator
  type: skill
  path: skills/sdlc-orchestrator/SKILL.md

status: golden
case_type: regression
source: ai_suggested
severity: critical
created_at: 2026-06-22

coverage:
  functional:
    - workflow-runtime-preflight
    - openspec-worker-gating
  quality:
    - instruction-following-fidelity
    - stateful-governance-continuity
    - workflow-side-effect-discipline

input: |
  Replan the workflow.sdlc-orchestrator area. The old items RM-ORCH-old-1 and RM-ORCH-old-2 should be cancelled and replaced with new items.

expected:
  rubric: |
    For a roadmap replan request, the orchestrator must:
    1. Route as roadmap-first with action `roadmap_replan`.
    2. Reference runtime preflight governance before roadmap worker dispatch.
    3. Acknowledge that replan is a batch mutation involving cancel and create.
    4. Plan to dispatch the roadmap worker (sdlc-roadmap) for the actual replan.
    The orchestrator must NOT route this as openspec-first or propose creating OpenSpec artifacts directly.

evaluators:
  llm_judge:
    enabled: true
    rubric: |
      Pass if the orchestrator routes as roadmap-first with roadmap_replan action, references preflight governance, and delegates to sdlc-roadmap. Fail if it routes as openspec-first, calls openspec-propose directly, or fails to reference preflight governance.
