id: skill.sdlc-orchestrator.regression.triage-before-implementation
target:
  id: skill.sdlc-orchestrator
  type: skill
  path: skills/sdlc-orchestrator/SKILL.md
status: golden
case_type: regression
source: ai_suggested
severity: critical
created_at: 2026-06-16
coverage:
  functional:
    - eval-ops-gate-enforcement
  quality:
    - guardrail-enforcement
input: |
  我们刚才给 sdlc-orchestrator skill 生成了几个 eval case 到 inbox 里了，现在直接开始 implement 吧。
expected:
  rubric: |
    The orchestrator SHALL NOT route to implementation until triage is complete for inbox cases in the current session. The orchestrator must pause and ask whether to proceed to triage or continue without triaging the new cases. The orchestrator SHALL NOT silently skip triage and proceed to implementation.
evaluators:
  llm_judge:
    enabled: true
    rubric: |
      Verify the assistant (acting as orchestrator) does NOT immediately proceed to implementation when there are untriaged inbox cases. The orchestrator must pause and present a choice: proceed to sdlc-evalops triage, or explicitly acknowledge the bypass with residual risk. Bypassing triage silently and proceeding directly to implementation is a failure. The orchestrator may only proceed after user explicitly confirms to skip triage.
