id: skill.sdlc-orchestrator.regression.question-tool-for-exclusive-paths

target:
  id: skill.sdlc-orchestrator
  type: skill
  path: skills/sdlc-orchestrator/SKILL.md

status: golden
case_type: regression
source: observed
severity: high
created_at: 2026-06-10

coverage:
  functional:
    - execution-path-choice-ux
  quality:
    - instruction-following-fidelity

input: |
  I have a change that crosses multiple skills. The orchestrator classified it as spec-driven-propose-flow. I asked to execute the plan.

actual: |
  The assistant presented the choice as a free-text paragraph with "You can either A) create an OpenSpec proposal or B) I can directly execute" without using the question tool.

expected:
  must_include: []
  must_not_include: []
  rubric: |
    After a spec-driven route is selected and the user asks to execute the plan, the assistant may continue the selected OpenSpec route directly. If it presents mutually exclusive execution paths (e.g., OpenSpec governance vs direct execution), it should prefer the question tool when available, with the recommended route listed first. If the tool is unavailable, a clear text choice is acceptable.

evaluators:
  llm_judge:
    enabled: true
    rubric: |
      Passing behavior is either: (1) continue the selected OpenSpec route directly, or (2) if offering mutually exclusive paths (OpenSpec proposal vs direct execution), use a structured choice mechanism (question tool if available) rather than only free-text. The recommended route should be presented first. Text fallback is acceptable when the tool is unavailable.
