id: skill.sdlc-orchestrator.regression.ambiguous-verify-request

target:
  id: skill.sdlc-orchestrator
  type: skill
  path: skills/sdlc-orchestrator/SKILL.md

status: golden
case_type: regression
source: observed
severity: critical
created_at: 2026-06-14

coverage:
  functional:
    - ambiguous-execution-handling
  edge_cases:
    - ambiguous-verify-vs-test-routing
  quality:
    - instruction-following-fidelity

input: |
  请验证 sdlc-evalops 相关的所有用例

actual: |
  The assistant silently ran pytest tests/test_evalops_skill.py and tests/test_evalops_root.py instead of asking which kind of verification the user wanted.

expected:
  must_include:
    - eval
    - pytest
  must_not_include:
    - test_evalops_root.py
  rubric: |
    The phrase "验证用例" is ambiguous: it could mean Promptfoo golden eval cases under .ai/evals/targets/skill.sdlc-evalops/ OR pytest unit tests under tests/. The orchestrator MUST recognize this ambiguity, STOP, and ask the user to disambiguate ("Do you mean the Promptfoo golden eval cases or the pytest unit tests?") BEFORE taking any action. It must NOT silently pick one and execute. This disambiguation must happen at the route classification layer, not after the wrong route has already been taken.

evaluators:
  rule_based:
    contains:
      - Promptfoo
      - pytest
  llm_judge:
    enabled: true
    rubric: |
      Verify the orchestrator recognizes that "验证 sdlc-evalops 相关的所有用例" is ambiguous between Promptfoo golden eval and pytest unit tests. The response MUST ask the user to clarify which kind of verification they want before proceeding. It must NOT silently run pytest tests or directly start Promptfoo eval without confirmation. The response should explicitly present both options (Promptfoo golden eval vs pytest unit tests) and ask the user to choose.
