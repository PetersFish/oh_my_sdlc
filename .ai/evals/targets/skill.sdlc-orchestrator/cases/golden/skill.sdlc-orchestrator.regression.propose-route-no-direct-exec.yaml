id: skill.sdlc-orchestrator.regression.propose-route-no-direct-exec

target:
  id: skill.sdlc-orchestrator
  type: skill
  path: skills/sdlc-orchestrator/SKILL.md

status: golden
case_type: regression
source: observed
severity: critical
created_at: 2026-06-10

coverage:
  functional:
    - route-binding
    - plan-mode-handoff
  quality:
    - instruction-following-fidelity

input: |
  Add a dry-run mode to the backup CLI command. The scope is clear and limited to one module, but it changes user-visible behavior and needs acceptance criteria. How should I approach this?

actual: |
  After classifying as spec-driven-propose-flow, the Plan Mode handoff said "退出 Plan Mode 后我可以直接执行这份 plan" instead of routing to openspec-propose.

expected:
  must_include:
    - openspec-propose
  must_not_include:
    - 直接执行
    - directly execute
  rubric: |
    When the orchestrator classifies a task as spec-driven-propose-flow, the response must route the user to OpenSpec proposal creation, not offer direct execution as the default path. The handoff language must name openspec-propose or OpenSpec change creation.

evaluators:
  rule_based:
    contains:
      - openspec-propose
      - OpenSpec
  llm_judge:
    enabled: true
    rubric: |
      Evaluate whether the response routes to OpenSpec proposal creation (openspec-propose) rather than defaulting to direct execution. The response must not present "directly execute the plan" as the default next step for a spec-driven-propose-flow route.
