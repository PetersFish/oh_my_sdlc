id: skill.sdlc-orchestrator.regression.roadmap-preflight-before-worker-dispatch

target:
  id: skill.sdlc-orchestrator
  type: skill
  path: skills/sdlc-orchestrator/SKILL.md

status: golden
case_type: regression
source: ai_suggested
severity: critical
created_at: 2026-06-22

coverage:
  functional:
    - workflow-runtime-preflight
    - openspec-worker-gating
    - boundary-preservation
  quality:
    - instruction-following-fidelity
    - stateful-governance-continuity
    - workflow-side-effect-discipline

input: |
  Revise roadmap item RM-ORCH-005 to update its acceptance criteria.

expected:
  rubric: |
    For a roadmap revise request, the orchestrator must:
    1. Route as roadmap-first (not openspec-first).
    2. Identify revise as a governed roadmap action (`roadmap_revise`).
    3. Reference runtime preflight governance before roadmap worker dispatch.
    4. Plan to dispatch the roadmap worker (sdlc-roadmap) after preflight passes.
    The orchestrator must NOT route this as openspec-first or call openspec-propose directly. It must NOT invoke sdlc-roadmap directly without mentioning the preflight gate.

evaluators:
  llm_judge:
    enabled: true
    rubric: |
      Pass if the orchestrator routes as roadmap-first, references roadmap_revise as a governed action, and describes running preflight before dispatching sdlc-roadmap. Fail if it routes as openspec-first, calls openspec-propose directly, or invokes sdlc-roadmap without mentioning the preflight governance gate.
