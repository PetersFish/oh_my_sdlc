id: skill.sdlc-orchestrator.regression.roadmap-mutation-preflight

target:
  id: skill.sdlc-orchestrator
  type: skill
  path: skills/sdlc-orchestrator/SKILL.md

status: golden
case_type: regression
source: ai_suggested
severity: critical
created_at: 2026-06-22

coverage:
  functional:
    - workflow-runtime-preflight
    - openspec-worker-gating
  quality:
    - instruction-following-fidelity
    - stateful-governance-continuity

input: |
  Capture a new roadmap item for adding dark mode support to the UI. Use the roadmap-first route.

expected:
  rubric: |
    For a roadmap capture request, the orchestrator must:
    1. Route as roadmap-first (not openspec-first).
    2. Identify capture as a governed roadmap action (`roadmap_capture`).
    3. Reference runtime preflight governance before roadmap worker dispatch.
    4. Plan to dispatch the roadmap worker (sdlc-roadmap) for the actual capture.
    The orchestrator must NOT route this as openspec-first or call openspec-propose/new-change directly.

evaluators:
  llm_judge:
    enabled: true
    rubric: |
      Pass if the orchestrator routes as roadmap-first, references roadmap_capture as a governed action, and describes running preflight before dispatching sdlc-roadmap. Fail if it routes as openspec-first, calls openspec-propose directly, or skips the preflight gate entirely.
