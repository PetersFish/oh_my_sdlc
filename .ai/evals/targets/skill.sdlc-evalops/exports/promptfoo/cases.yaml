# Golden cases exported for skill.sdlc-evalops
# Source: cases/golden
# Generated by sdlc-evalops export-promptfoo.py - DO NOT EDIT

- vars:
    input: 'Compare how Claude 4.5, GPT-5, and Gemini 3 handle this Python refactoring
      task. Which one gives the cleanest output?

      '
  assert:
  - type: llm-rubric
    value: 'This is a one-off model comparison without any durable case management
      request. The assistant must NOT activate sdlc-evalops. EvalOps requires durable
      case lifecycle management under .ai/evals/.

      '
- vars:
    input: 'My API endpoint is returning a 500 error when I pass an empty request
      body. Help me debug this.

      '
  assert:
  - type: llm-rubric
    value: 'This is a single-code-bug debugging request. The assistant must route
      to systematic-debugging, NOT to sdlc-evalops. EvalOps is for durable eval asset
      management, not one-off bug fixes.

      '
- vars:
    input: 'Review the wording of this skill''s description and suggest improvements
      to make it clearer. Don''t change any eval assets.

      '
  assert:
  - type: llm-rubric
    value: 'This is a skill wording review without any request to manage durable eval
      assets. The assistant must NOT activate sdlc-evalops. Skill creation/modification
      should route to meta-skill-lifecycle-governance or general review.

      '
- vars:
    input: 'Write unit tests for this calculateDiscount function that handles edge
      cases for negative prices and zero quantities.

      '
  assert:
  - type: llm-rubric
    value: 'This is a unit test request. The assistant must route to test-driven-development,
      NOT to sdlc-evalops. EvalOps manages durable AI behavior eval assets, not code
      unit tests.

      '
- vars:
    input: 'research skill 的搜索结果又丢失了 ArXiv 来源。帮我把这个回归问题 capture 下来。

      '
  assert:
  - type: llm-rubric
    value: 'The assistant must recognize this as a capture-regression task. It must
      follow the capture-regression workflow: identify the target, extract failure
      context, ask for confirmation before writing, and default the case to inbox
      (not golden). The assistant SHALL NOT skip ahead to implementation or unrelated
      tasks.

      '
- vars:
    input: 'promptfoo eval 跑完了，有两个 case failed。你帮我看看怎么修。

      '
  assert:
  - type: llm-rubric
    value: 'When golden eval returns failures, the assistant MUST classify each failure
      into one of five categories (target-behavior-bug, case-expectation-bug, evaluator-issue,
      runner-config-issue, model-variance), present a suggested fix plan, and require
      user confirmation before modifying the target, case, evaluator, or runner config.
      The assistant SHALL NOT auto-fix or modify any file until the user confirms
      the fix plan.

      '
- vars:
    input: '刚才 research skill 又遗漏了成本分析，帮我把这个失败沉淀下来。

      '
  assert:
  - type: llm-rubric
    value: 'The assistant must recognize the capture-regression intent, extract context
      from conversation, ask for confirmation before writing, and default to inbox
      (not golden).

      '
- vars:
    input: '请为 research skill 建立一套评测体系，覆盖回归测试和评估用例。

      '
  assert:
  - type: llm-rubric
    value: 'Chinese trigger phrases 评测体系, 评估用例, 回归测试 must activate sdlc-evalops for
      durable eval asset management, not route to systematic-debugging or test-driven-development.

      '
- vars:
    input: '帮我给 research-general skill 建一套 eval case，用于回归测试。

      '
  assert:
  - type: llm-rubric
    value: 'The assistant must recognize this as a create-eval-suite intent, check
