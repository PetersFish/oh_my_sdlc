schema_version: "1.0"

models:
  - name: opencode-go-deepseek-v4-pro
    provider: opencode-go
    model: deepseek-v4-pro
    promptfoo:
      id: openai:chat:deepseek-v4-pro
      label: opencode-go/deepseek-v4-pro
      config:
        apiBaseUrl: https://opencode.ai/zen/go/v1
        apiKeyEnvar: OPENCODE_GO_API_KEY
        headers:
          Accept-Encoding: identity
        temperature: 0
        max_tokens: 4096
    grader:
      id: openai:chat:glm-5.1
      config:
        apiBaseUrl: https://opencode.ai/zen/go/v1
        apiKeyEnvar: OPENCODE_GO_API_KEY
        headers:
          Accept-Encoding: identity
        temperature: 0
        max_tokens: 4096

environments:
  primary: cli
  additional: []

target_selection:
  default: all
  filter_by_type: []

run_policy:
  mode: sequential
  fail_fast: false
  timeout_seconds: 300
  retry_count: 0
  parallel: false

note: >
  The matrix runner is available via skills/sdlc-evalops/scripts/run-eval-matrix.py.
  This file defines the model, provider, grader, environment, target selection,
  and run policy inputs for the runner. The default model (opencode-go-deepseek-v4-pro)
  uses Promptfoo's built-in OpenAI-compatible provider with apiBaseUrl, apiKeyEnvar,
  and headers.Accept-Encoding: identity. No custom Python provider is required or distributed.
