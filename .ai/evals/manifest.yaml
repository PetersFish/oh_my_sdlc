schema_version: "1.0"

targets:
  - id: skill.sdlc-orchestrator
    workspace: targets/skill.sdlc-orchestrator

default_export_policy:
  promptfoo:
    derive_from: golden_cases
    output_dir: exports/promptfoo
    source_injection: true
    freshness_check_inputs:
      - golden_cases
      - target_manifest
      - source_files
      - templates

default_assertion_policy:
  prefer_deterministic: true
  allow_llm_rubric: true
  prohibit_global_assertions: true

report_policy:
  storage_dir: reports
  retention: keep_all
  required_fields:
    - target_id
    - case_counts
    - export_freshness_status
    - eval_command
    - pass_fail_result_count
    - report_path

platform_directories:
  templates: templates
  schemas: schemas
  runners: runners

model_matrix_path: model-matrix.yaml
